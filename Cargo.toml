[package]
name = "agent-isle"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "agent-isle"
path = "src/main.rs"

[features]
default = ["podman"]
podman = []

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
regex = "1"
scopeguard = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
httparse = "1"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[lints.clippy]
too_many_lines = { level = "deny", priority = 1 }
excessive_nesting = { level = "deny", priority = 1 }

[dev-dependencies]
assert_cmd = "2"
indoc = "2"
predicates = "3"
rstest = "0.23"
tempfile = "3"
